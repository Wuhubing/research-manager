<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研管理器</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1da;
  --accent: #2f5d50; --accent-ink: #fff; --soft: #eef2ef;
  --main: #2f7d4f; --branch: #b07a12; --drift: #b23a3a; --rec: #d13b3b; --edit: #b0641a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201e; --ink: #ecebe6; --muted: #9a9890; --line: #33342f;
    --accent: #7fbfa8; --accent-ink: #10201a; --soft: #24302b;
    --main: #6fcf97; --branch: #e2b450; --drift: #ef7a7a; --edit: #e8a15a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 16px 14px 10px; }
aside h1 { font-size: 16px; margin: 0 0 10px; }
#search { width: 100%; }
#sessions { overflow: auto; padding: 0 8px 16px; flex: 1; }
.group { font-size: 12px; color: var(--muted); margin: 14px 6px 4px; word-break: break-all; }
.sess { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; border: 0;
  background: none; color: var(--ink); cursor: pointer; font: inherit; }
.sess:hover { background: var(--soft); }
.sess.active { background: var(--soft); font-weight: 600; }
.sess .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .m { font-size: 12px; color: var(--muted); font-weight: 400; }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--main); margin-right: 5px; vertical-align: 1px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.colhead { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.colhead h2 { font-size: 15px; margin: 0; }
.colbody { overflow: auto; flex: 1; padding: 12px 18px; }
.status { color: var(--muted); font-size: 12.5px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 6px 12px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.small { padding: 2px 9px; font-size: 12.5px; }
textarea, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; resize: vertical; }
.act { font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.act .u { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 14px; font-weight: 600;
  background: var(--soft); padding: 6px 10px; border-radius: 8px; margin: 14px 0 6px; }
.act .a { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13.5px; margin: 4px 0; }
.act .tool { color: var(--muted); display: block; }
.act .edit { color: var(--edit); display: block; }
.act .err { color: var(--drift); display: block; }
.mainline { background: var(--soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; }
.mainline summary { cursor: pointer; font-weight: 600; }
.turn { margin-bottom: 20px; }
.said { background: var(--soft); border-radius: 10px; padding: 7px 12px; margin-bottom: 8px; }
.said .status { display: block; }
.reply h3 { font-size: 14.5px; margin: 12px 0 4px; }
.reply ul, .reply ol { margin: 2px 0 6px; padding-left: 20px; }
.reply p { margin: 4px 0; }
.reply code { background: var(--soft); padding: 0 4px; border-radius: 4px; font-size: 12.5px; }
.tag-mainline { color: var(--main); font-weight: 600; } .tag-branch { color: var(--branch); font-weight: 600; } .tag-drift { color: var(--drift); font-weight: 600; }
.warnsec { background: color-mix(in srgb, var(--drift) 9%, transparent); border-radius: 8px; padding: 2px 12px 6px; }
.prompt { border: 1px solid var(--accent); border-radius: 10px; margin-top: 8px; }
.prompt .ph { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.prompt pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; font: 12.5px/1.55 ui-monospace, Menlo, monospace; max-height: 340px; overflow: auto; }
.suggest { border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
.suggest pre { white-space: pre-wrap; font-size: 12.5px; margin: 6px 0; }
.composer { border-top: 1px solid var(--line); padding: 12px 18px; background: var(--panel); }
.row { display: flex; gap: 8px; align-items: center; }
.mic { width: 46px; height: 46px; border-radius: 50%; font-size: 19px; display: grid; place-items: center; padding: 0; flex: none; }
.mic.recording { background: var(--rec); border-color: var(--rec); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--rec) 22%, transparent); } }
.empty { color: var(--muted); padding: 60px 20px; text-align: center; }
.thinking { color: var(--muted); font-size: 13px; padding: 6px 0; }
@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; height: auto; } aside { max-height: 40vh; }
  main { grid-template-columns: 1fr; } .col { border-right: 0; border-bottom: 1px solid var(--line); max-height: 80vh; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>🔬 科研管理器</h1>
      <input id="search" placeholder="搜索会话 / 目录">
      <div class="status" style="margin-top:6px" id="sys"></div>
    </header>
    <div id="sessions"></div>
  </aside>
  <main id="main"><div class="empty" style="grid-column:1/-1">← 选一个 Claude Code 会话</div></main>
</div>

<template id="tpl">
  <section class="col">
    <div class="colhead">
      <h2 id="stitle"></h2>
      <div class="status" id="smeta"></div>
    </div>
    <div class="colbody"><div class="act" id="activity"></div></div>
  </section>
  <section class="col">
    <div class="colhead">
      <h2>管家</h2>
      <div class="status">只读查看这个会话和项目文件，对照主线做归纳、写 prompt</div>
    </div>
    <div class="colbody" id="mgrbody">
      <details class="mainline" id="mlbox">
        <summary>研究主线</summary>
        <textarea id="mltext" rows="9" style="margin-top:8px;font-size:13px"></textarea>
        <div class="row" style="margin-top:6px"><button class="small" onclick="saveMainline()">保存</button><span class="status" id="mlst"></span></div>
      </details>
      <div id="turns"></div>
    </div>
    <div class="composer">
      <div class="row">
        <button class="mic" id="mic" title="开始/停止录音">🎙</button>
        <textarea id="said" rows="2" placeholder="点麦克风说话，或直接打字。比如：它刚才到底干了什么？/ 帮我写个 prompt 让它只改第二题"></textarea>
      </div>
      <div class="row" style="margin-top:8px;justify-content:space-between">
        <span class="status" id="micst">回车发送 · Shift+回车换行</span>
        <span class="row">
          <button onclick="ask(true)" id="sumbtn">只归纳</button>
          <button class="primary" onclick="ask()" id="sendbtn">发送</button>
        </span>
      </div>
    </div>
  </section>
</template>

<script>
let SESSIONS = [], CUR = null, busy = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = t => { const m = (Date.now() / 1000 - t) / 60; return m < 1 ? "刚刚" : m < 60 ? `${m | 0} 分钟前` : m < 1440 ? `${(m / 60) | 0} 小时前` : `${(m / 1440) | 0} 天前`; };
const short = p => p.replace(/^\/Users\/[^/]+/, "~").replace(/~\/Library\/Application Support\/Claude\/scratch-workspaces\/.*/, "（无文件夹）");

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

// ---------- 会话列表 ----------
async function loadSessions() {
  SESSIONS = await api("/api/sessions");
  renderSessions();
}
function renderSessions() {
  const q = $("#search").value.trim().toLowerCase();
  const groups = new Map();
  for (const s of SESSIONS) {
    if (q && !(s.title + s.cwd).toLowerCase().includes(q)) continue;
    const g = short(s.cwd);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(s);
  }
  $("#sessions").innerHTML = [...groups].map(([g, list]) =>
    `<div class="group">${esc(g)}</div>` + list.map(s => {
      const live = Date.now() / 1000 - s.mtime < 180;
      return `<button class="sess ${CUR && CUR.id === s.id ? "active" : ""}" onclick="openSession('${s.id}')">
        <span class="t">${live ? '<span class="live" title="最近 3 分钟有活动"></span>' : ""}${esc(s.title)}</span>
        <span class="m">${ago(s.mtime)}</span></button>`;
    }).join("")).join("") || `<div class="empty">没有找到会话</div>`;
}
$("#search").oninput = renderSessions;

// ---------- 打开会话 ----------
async function openSession(id, keepScroll) {
  const d = await api("/api/sessions/" + id);
  const first = !CUR || CUR.id !== id;
  CUR = d;
  try { localStorage.setItem("rm-session", id); } catch {}
  if (first) {
    $("#main").innerHTML = "";
    $("#main").append($("#tpl").content.cloneNode(true));
    setupMic();
    $("#said").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } };
    $("#mltext").value = d.mainline;
    if (d.mainline.includes("：\n") || d.mainline.trim().endsWith("：")) $("#mlbox").open = true;
    renderTurns();
  }
  $("#stitle").textContent = d.title;
  $("#smeta").textContent = `${short(d.cwd)} · 更新于 ${ago(d.mtime)}`;
  const box = $("#activity"), atBottom = box.parentElement.scrollHeight - box.parentElement.scrollTop - box.parentElement.clientHeight < 80;
  box.innerHTML = renderActivity(d.activity);
  if (first || atBottom) box.parentElement.scrollTop = box.parentElement.scrollHeight;
  renderSessions();
}

function renderActivity(text) {
  if (!text.trim()) return `<div class="empty">这个会话还没有内容</div>`;
  return text.split("\n").map(l => {
    if (l.startsWith("👤")) return `<span class="u">${esc(l.replace("👤 研究者：", "👤 "))}</span>`;
    if (l.startsWith("🤖")) return `<span class="a">${esc(l.replace("🤖 agent：", "🤖 "))}</span>`;
    if (/^\s+🔧 (Edit|Write|MultiEdit|NotebookEdit)/.test(l) || /^\s+[-+] /.test(l)) return `<span class="edit">${esc(l)}</span>`;
    if (/^\s+✗/.test(l)) return `<span class="err">${esc(l)}</span>`;
    if (/^\s+🔧/.test(l)) return `<span class="tool">${esc(l)}</span>`;
    return l.trim() ? `<span class="a">${esc(l)}</span>` : "";
  }).join("");
}

// ---------- 管家对话 ----------
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", list = null, inWarn = false;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/【主线推进】/g, '<span class="tag-mainline">【主线推进】</span>')
      .replace(/【支线】/g, '<span class="tag-branch">【支线】</span>')
      .replace(/【偏离主线】/g, '<span class="tag-drift">【偏离主线】</span>');
    let m;
    if ((m = l.match(/^#{1,3} (.*)/))) {
      close(); if (inWarn) { html += "</div>"; inWarn = false; }
      if (m[1].includes("⚠")) { html += `<div class="warnsec">`; inWarn = true; }
      html += `<h3>${m[1]}</h3>`;
    } else if ((m = l.match(/^\s*[-*] (.*)/))) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${m[1]}</li>`;
    } else if ((m = l.match(/^\s*\d+[.)] (.*)/))) {
      if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${m[1]}</li>`;
    } else if (l.trim()) { close(); html += `<p>${l}</p>`; }
  }
  close(); if (inWarn) html += "</div>";
  return html;
}

function turnHTML(t, i) {
  const reply = (t.reply || "").replace(/```prompt[\s\S]*?```/, "").replace(/## Prompt\s*$/m, "");
  return `<div class="turn">
    <div class="said"><span class="status">${new Date(t.time * 1000).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}${t.session_title && t.session !== CUR.id ? " · 关于会话：" + esc(t.session_title) : ""}</span>${esc(t.said || "（只要归纳）")}</div>
    <div class="reply">${md(reply)}</div>
    ${t.prompt ? `<div class="prompt"><div class="ph"><b>Prompt</b><button class="small" onclick="copyPrompt(${i}, this)">复制</button></div><pre>${esc(t.prompt)}</pre></div>` : ""}
    ${t.mainline ? `<div class="suggest"><b>建议更新主线</b><pre>${esc(t.mainline)}</pre><button class="small" onclick="adoptMainline(${i}, this)">采纳</button></div>` : ""}
  </div>`;
}
function renderTurns() {
  $("#turns").innerHTML = CUR.history.length
    ? CUR.history.map(turnHTML).join("")
    : `<div class="empty" style="padding:30px 0">还没和管家聊过。<br>试试点「只归纳」，或者说：“它刚才到底干了什么？”</div>`;
  $("#mgrbody").scrollTop = $("#mgrbody").scrollHeight;
}
async function copyPrompt(i, btn) {
  await navigator.clipboard.writeText(CUR.history[i].prompt);
  btn.textContent = "已复制 ✓"; setTimeout(() => btn.textContent = "复制", 1500);
}
async function adoptMainline(i, btn) {
  await api(`/api/sessions/${CUR.id}/mainline`, { text: CUR.history[i].mainline });
  $("#mltext").value = CUR.history[i].mainline;
  btn.textContent = "已采纳 ✓"; btn.disabled = true;
}
async function saveMainline() {
  await api(`/api/sessions/${CUR.id}/mainline`, { text: $("#mltext").value });
  $("#mlst").textContent = "已保存 ✓"; setTimeout(() => $("#mlst").textContent = "", 1500);
}

async function ask(summaryOnly) {
  if (busy) return;
  const said = summaryOnly ? "" : $("#said").value.trim();
  if (!summaryOnly && !said) return;
  busy = true; $("#sendbtn").disabled = $("#sumbtn").disabled = true;
  const id = CUR.id;
  const t0 = Date.now();
  $("#turns").insertAdjacentHTML("beforeend", `<div class="turn" id="pending"><div class="said">${esc(said || "（只要归纳）")}</div><div class="thinking" id="thinking">管家正在看会话、核实文件…</div></div>`);
  $("#mgrbody").scrollTop = $("#mgrbody").scrollHeight;
  const tick = setInterval(() => { const e = $("#thinking"); if (e) e.textContent = `管家正在看会话、核实文件… ${((Date.now() - t0) / 1000) | 0}s`; }, 1000);
  try {
    const r = await api(`/api/sessions/${id}/ask`, { said });
    if (!summaryOnly) $("#said").value = "";
    if (CUR.id === id) {
      CUR.history.push({ ...r, session: id, session_title: CUR.title });
      renderTurns();
      if (r.prompt) { try { await navigator.clipboard.writeText(r.prompt); $("#micst").textContent = "prompt 已自动复制到剪贴板 ✓"; } catch {} }
    }
  } catch (e) {
    const p = $("#thinking"); if (p) p.textContent = "失败：" + e.message;
  }
  clearInterval(tick);
  busy = false; $("#sendbtn").disabled = $("#sumbtn").disabled = false;
}

// ---------- 录音 ----------
function setupMic() {
  const btn = $("#mic"), st = $("#micst");
  let rec = null, chunks = [], t0, timer;
  btn.onclick = async () => {
    if (rec) { rec.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) {
      st.textContent = "无法使用麦克风";
      alert("无法使用麦克风：" + e.message + "\n\n请用 Chrome 或 Safari 打开 http://localhost:8765（Claude 内置浏览器不支持麦克风），并在「系统设置 → 隐私与安全性 → 麦克风」里允许该浏览器。");
      return;
    }
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      clearInterval(timer); stream.getTracks().forEach(t => t.stop());
      btn.classList.remove("recording"); btn.disabled = true; rec = null;
      st.textContent = "本地 Whisper 识别中…";
      try {
        const r = await fetch("/api/transcribe", { method: "POST", body: new Blob(chunks, { type: chunks[0]?.type || "audio/webm" }) });
        const j = await r.json(); if (j.error) throw new Error(j.error);
        const t = $("#said"); t.value = (t.value ? t.value + " " : "") + j.text; t.focus();
        st.textContent = "识别完成 ✓ 检查一下，回车发送";
      } catch (e) { st.textContent = "识别失败：" + e.message; }
      btn.disabled = false;
    };
    rec.start(); btn.classList.add("recording"); t0 = Date.now();
    timer = setInterval(() => st.textContent = `● 录音中 ${((Date.now() - t0) / 1000) | 0}s，再点一次结束`, 300);
  };
}

(async () => {
  const st = await api("/api/status");
  $("#sys").innerHTML = `Whisper ${st.whisper && st.model ? "✓" : "✗"} · Claude CLI ${st.claude ? "✓" : "✗"} · <a href="/projects.html" style="color:inherit">旧版项目页</a>`;
  await loadSessions();
  let last = null; try { last = localStorage.getItem("rm-session"); } catch {}
  const pick = SESSIONS.find(s => s.id === last);
  if (pick) openSession(pick.id);
  // 定时刷新：会话列表和当前会话的动态
  setInterval(async () => {
    await loadSessions();
    if (CUR && !busy) openSession(CUR.id, true);
  }, 15000);
})();
</script>
</body>
</html>
